<!DOCTYPE html>
<html>

<head>

    <title>Art Mentor</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .chat-container {
            width: 650px;
            max-width: 95%;
            height: 750px;
            margin: 25px auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .header p {
            margin-bottom: 0;
        }

        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.5;
        }

        .user {
            background: #dbeafe;
            margin-left: auto;
        }

        .ai {
            background: #eeeeee;
            margin-right: auto;
        }

        .art-preview {
            max-width: 250px;
            max-height: 250px;
            display: block;
            margin-top: 10px;
            border-radius: 8px;
        }

        .input-area {
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #attachButton {
            background: #eee;
        }

        #sendButton {
            background: #222;
            color: white;
        }

        #fileInput {
            display: none;
        }

        #selectedFile {
            display: none;
            margin-bottom: 10px;
            padding: 8px;
            background: #f0f0f0;
            border-radius: 8px;
        }

        #selectedImage {
            max-width: 100px;
            max-height: 100px;
            display: none;
            margin-top: 5px;
            border-radius: 5px;
        }

    </style>

</head>

<body>

    <div class="chat-container">

        <div class="header">

            <h1>Art Mentor 🎨</h1>

            <p>
                Critical, honest and encouraging
            </p>

        </div>

        <div id="messages">

            <div class="message ai">

                <b>Art Mentor:</b>

                Upload an artwork and I'll give you an honest critique.

                I'll also rate every artwork out of 10.

            </div>

        </div>

        <div class="input-area">

            <div id="selectedFile">

                Selected artwork:

                <span id="fileName"></span>

                <img id="selectedImage">

            </div>

            <div class="controls">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Ask your art teacher..."
                >

                <input
                    id="fileInput"
                    type="file"
                    accept="image/png,image/jpeg,image/webp"
                >

                <button id="attachButton">
                    📎
                </button>

                <button id="sendButton">
                    Send
                </button>

            </div>

        </div>

    </div>


    <script>

        const input =
            document.getElementById("messageInput");

        const messages =
            document.getElementById("messages");

        const fileInput =
            document.getElementById("fileInput");

        const attachButton =
            document.getElementById("attachButton");

        const sendButton =
            document.getElementById("sendButton");

        const selectedFile =
            document.getElementById("selectedFile");

        const fileName =
            document.getElementById("fileName");

        const selectedImage =
            document.getElementById("selectedImage");

        let selectedImageData = null;


        attachButton.addEventListener("click", function() {

            fileInput.click();

        });


        fileInput.addEventListener("change", function() {

            const file = fileInput.files[0];

            if (!file) {
                return;
            }

            if (!file.type.startsWith("image/")) {

                alert("Please select an image.");

                return;
            }

            fileName.textContent = file.name;

            selectedFile.style.display = "block";

            const reader = new FileReader();

            reader.onload = function(event) {

                selectedImage.src = event.target.result;

                selectedImage.style.display = "block";

                selectedImageData = {
                    mimeType: file.type,
                    data: event.target.result.split(",")[1]
                };

            };

            reader.readAsDataURL(file);

        });


        sendButton.addEventListener("click", sendMessage);


        input.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        });


        async function sendMessage() {

            const message = input.value.trim();

            if (message === "" && !selectedImageData) {

                return;

            }


            let userHTML = "<b>You:</b>";

            if (message !== "") {

                userHTML += `<p>${message}</p>`;

            }


            if (selectedImageData) {

                userHTML += `
                    <img
                        class="art-preview"
                        src="data:${selectedImageData.mimeType};base64,${selectedImageData.data}"
                    >
                `;

            }


            messages.innerHTML += `
                <div class="message user">
                    ${userHTML}
                </div>
            `;


            input.value = "";


            const loading =
                document.createElement("div");

            loading.className = "message ai";

            loading.id = "loading";

            loading.innerHTML =
                "<b>Art Mentor:</b> Analyzing your artwork...";

            messages.appendChild(loading);

            messages.scrollTop =
                messages.scrollHeight;


            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        message: message,

                        image: selectedImageData

                    })

                });


                const data =
                    await response.json();


                loading.remove();


                messages.innerHTML += `
                    <div class="message ai">
                        <b>Art Mentor:</b>
                        <p>${data.reply.replace(/\n/g, "<br>")}</p>
                    </div>
                `;


            } catch (error) {

                console.error(error);

                loading.innerHTML =
                    "<b>Art Mentor:</b> Connection failed.";

            }


            selectedImageData = null;

            fileInput.value = "";

            selectedFile.style.display = "none";

            selectedImage.style.display = "none";


            messages.scrollTop =
                messages.scrollHeight;

        }

    </script>

</body>

</html>
