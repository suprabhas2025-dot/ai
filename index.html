<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Art Mentor 🎨</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
            transition: background 0.25s, color 0.25s;
        }

        body.dark {
            background: #121212;
            color: #eeeeee;
        }

        .chat-container {
            width: 650px;
            max-width: 95%;
            height: 750px;
            margin: 25px auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            transition: background 0.25s, box-shadow 0.25s;
        }

        body.dark .chat-container {
            background: #1e1e1e;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
        }

        .header {
            background: #222;
            color: white;
            padding: 18px 20px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            margin: 0;
        }

        .header p {
            margin-bottom: 0;
        }

        #themeButton {
            position: absolute;
            right: 15px;
            top: 15px;
            background: #444;
            color: white;
            padding: 8px 10px;
            font-size: 18px;
        }

        #themeButton:hover {
            background: #555;
        }

        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.5;
            overflow-wrap: break-word;
        }

        .user {
            background: #dbeafe;
            color: #222;
            margin-left: auto;
        }

        body.dark .user {
            background: #263b52;
            color: #eeeeee;
        }

        .ai {
            background: #eeeeee;
            color: #222;
            margin-right: auto;
        }

        body.dark .ai {
            background: #2b2b2b;
            color: #eeeeee;
        }

        .art-preview {
            max-width: 250px;
            max-height: 250px;
            display: block;
            margin-top: 10px;
            border-radius: 8px;
        }

        .input-area {
            padding: 15px;
            border-top: 1px solid #ddd;
            background: white;
            transition: background 0.25s, border-color 0.25s;
        }

        body.dark .input-area {
            background: #1e1e1e;
            border-top-color: #444;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            background: white;
            color: #222;
        }

        #messageInput:focus {
            border-color: #555;
        }

        body.dark #messageInput {
            background: #2b2b2b;
            color: white;
            border-color: #555;
        }

        body.dark #messageInput::placeholder {
            color: #aaa;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        #attachButton {
            background: #eee;
        }

        #attachButton:hover {
            background: #ddd;
        }

        body.dark #attachButton {
            background: #444;
            color: white;
        }

        body.dark #attachButton:hover {
            background: #555;
        }

        #sendButton {
            background: #222;
            color: white;
        }

        #sendButton:hover {
            background: #444;
        }

        #fileInput {
            display: none;
        }

        #selectedFile {
            display: none;
            margin-bottom: 10px;
            padding: 8px;
            background: #f0f0f0;
            border-radius: 8px;
        }

        body.dark #selectedFile {
            background: #2b2b2b;
        }

        #selectedImage {
            max-width: 100px;
            max-height: 100px;
            display: none;
            margin-top: 5px;
            border-radius: 5px;
        }

        .error {
            color: #b91c1c;
        }

        body.dark .error {
            color: #ff7070;
        }

        @media (max-width: 600px) {

            .chat-container {
                height: 95vh;
                margin: 10px auto;
            }

            .controls {
                gap: 5px;
            }

            button {
                padding: 12px;
            }

        }

    </style>

</head>


<body>


    <div class="chat-container">


        <div class="header">

            <button
                id="themeButton"
                type="button"
                title="Toggle light/dark mode"
            >
                🌙
            </button>

            <h1>Art Mentor 🎨</h1>

            <p>
                Critical, honest and encouraging
            </p>

        </div>


        <div id="messages">

            <div class="message ai">

                <b>Art Mentor:</b>

                <p>
                    Upload an artwork and I'll give you an honest critique.
                </p>

                <p>
                    I'll also rate every artwork out of 10.
                </p>

            </div>

        </div>


        <div class="input-area">


            <div id="selectedFile">

                <b>Selected artwork:</b>

                <span id="fileName"></span>

                <img id="selectedImage">

            </div>


            <div class="controls">


                <input
                    id="messageInput"
                    type="text"
                    placeholder="Ask your art teacher..."
                    autocomplete="off"
                >


                <input
                    id="fileInput"
                    type="file"
                    accept="image/png,image/jpeg,image/webp"
                >


                <button
                    id="attachButton"
                    type="button"
                    title="Attach artwork"
                >
                    📎
                </button>


                <button
                    id="sendButton"
                    type="button"
                >
                    Send
                </button>


            </div>


        </div>


    </div>


    <script>


        // --------------------------------------------------
        // ELEMENTS
        // --------------------------------------------------

        const input =
            document.getElementById("messageInput");

        const messages =
            document.getElementById("messages");

        const fileInput =
            document.getElementById("fileInput");

        const attachButton =
            document.getElementById("attachButton");

        const sendButton =
            document.getElementById("sendButton");

        const selectedFile =
            document.getElementById("selectedFile");

        const fileName =
            document.getElementById("fileName");

        const selectedImage =
            document.getElementById("selectedImage");

        const themeButton =
            document.getElementById("themeButton");


        // --------------------------------------------------
        // IMAGE DATA
        // --------------------------------------------------

        let selectedImageData = null;


        // --------------------------------------------------
        // LIGHT / DARK MODE
        // --------------------------------------------------

        const savedTheme =
            localStorage.getItem("artMentorTheme");


        if (savedTheme === "dark") {

            document.body.classList.add("dark");

            themeButton.textContent = "☀️";

        }


        themeButton.addEventListener(
            "click",
            function () {

                document.body.classList.toggle("dark");


                const isDark =
                    document.body.classList.contains("dark");


                if (isDark) {

                    themeButton.textContent = "☀️";

                    localStorage.setItem(
                        "artMentorTheme",
                        "dark"
                    );

                } else {

                    themeButton.textContent = "🌙";

                    localStorage.setItem(
                        "artMentorTheme",
                        "light"
                    );

                }

            }
        );


        // --------------------------------------------------
        // OPEN FILE SELECTOR
        // --------------------------------------------------

        attachButton.addEventListener(
            "click",
            function () {

                fileInput.click();

            }
        );


        // --------------------------------------------------
        // HANDLE IMAGE
        // --------------------------------------------------

        fileInput.addEventListener(
            "change",
            function () {

                const file =
                    fileInput.files[0];


                if (!file) {

                    return;

                }


                if (!file.type.startsWith("image/")) {

                    alert("Please select an image.");

                    fileInput.value = "";

                    return;

                }


                fileName.textContent =
                    file.name;

                selectedFile.style.display =
                    "block";


                const reader =
                    new FileReader();


                reader.onload =
                    function (event) {

                        selectedImage.src =
                            event.target.result;

                        selectedImage.style.display =
                            "block";


                        selectedImageData = {

                            mimeType:
                                file.type,

                            data:
                                event.target.result
                                    .split(",")[1]

                        };

                    };


                reader.readAsDataURL(file);

            }
        );


        // --------------------------------------------------
        // SEND BUTTON
        // --------------------------------------------------

        sendButton.addEventListener(
            "click",
            sendMessage
        );


        // --------------------------------------------------
        // ENTER KEY
        // --------------------------------------------------

        input.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        // --------------------------------------------------
        // SEND MESSAGE
        // --------------------------------------------------

        async function sendMessage() {


            const message =
                input.value.trim();


            if (
                message === "" &&
                !selectedImageData
            ) {

                return;

            }


            // --------------------------------------------------
            // SHOW USER MESSAGE
            // --------------------------------------------------

            let userHTML =
                "<b>You:</b>";


            if (message !== "") {

                userHTML +=
                    `<p>${escapeHTML(message)}</p>`;

            }


            if (selectedImageData) {

                userHTML += `
                    <img
                        class="art-preview"
                        src="data:${selectedImageData.mimeType};base64,${selectedImageData.data}"
                    >
                `;

            }


            const userMessage =
                document.createElement("div");

            userMessage.className =
                "message user";

            userMessage.innerHTML =
                userHTML;

            messages.appendChild(
                userMessage
            );


            input.value = "";


            // --------------------------------------------------
            // LOADING MESSAGE
            // --------------------------------------------------

            const loading =
                document.createElement("div");

            loading.className =
                "message ai";

            loading.innerHTML =
                "<b>Art Mentor:</b> Analyzing your artwork...";


            messages.appendChild(
                loading
            );


            messages.scrollTop =
                messages.scrollHeight;


            // --------------------------------------------------
            // SEND TO RENDER
            // --------------------------------------------------

            try {


                console.log(
                    "Sending request to Render..."
                );


                const response =
                    await fetch(
                        "https://ai-rxzd.onrender.com/chat",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    message:
                                        message,

                                    image:
                                        selectedImageData

                                })

                        }
                    );


                console.log(
                    "Server response:",
                    response.status
                );


                if (!response.ok) {

                    throw new Error(
                        "Server returned HTTP " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                console.log(
                    "AI response received."
                );


                loading.remove();


                // --------------------------------------------------
                // SHOW AI RESPONSE
                // --------------------------------------------------

                const aiMessage =
                    document.createElement("div");

                aiMessage.className =
                    "message ai";


                aiMessage.innerHTML = `

                    <b>Art Mentor:</b>

                    <p>
                        ${formatResponse(data.reply)}
                    </p>

                `;


                messages.appendChild(
                    aiMessage
                );


            }


            catch (error) {


                console.error(
                    "CHAT ERROR:",
                    error
                );


                loading.innerHTML = `

                    <b>Art Mentor:</b>

                    <p class="error">
                        Connection failed.
                    </p>

                    <small>
                        ${escapeHTML(error.message)}
                    </small>

                `;

            }


            // --------------------------------------------------
            // CLEAR IMAGE
            // --------------------------------------------------

            selectedImageData =
                null;

            fileInput.value =
                "";

            selectedFile.style.display =
                "none";

            selectedImage.style.display =
                "none";


            messages.scrollTop =
                messages.scrollHeight;

        }


        // --------------------------------------------------
        // ESCAPE HTML
        // --------------------------------------------------

        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent =
                text;

            return div.innerHTML;

        }


        // --------------------------------------------------
        // FORMAT AI RESPONSE
        // --------------------------------------------------

        function formatResponse(text) {

            if (!text) {

                return "The AI returned an empty response.";

            }


            return escapeHTML(text)
                .replace(/\n/g, "<br>");

        }


    </script>


</body>

</html>
