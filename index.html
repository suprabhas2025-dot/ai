<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Art Mentor 🎨</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    color: #222;
    transition: 0.25s;
}

body.dark {
    background: #121212;
    color: #eee;
}

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 280px;
    background: white;
    border-right: 1px solid #ddd;
    padding: 15px;
    display: flex;
    flex-direction: column;
}

body.dark .sidebar {
    background: #1b1b1b;
    border-color: #444;
}

.sidebar h2 {
    margin-top: 0;
}

#historySearch {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 10px;
}

body.dark #historySearch {
    background: #292929;
    color: white;
    border-color: #555;
}

.history {
    flex: 1;
    overflow-y: auto;
}

.history-item {
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    background: #f1f1f1;
}

.history-item:hover {
    background: #ddd;
}

body.dark .history-item {
    background: #292929;
}

body.dark .history-item:hover {
    background: #3a3a3a;
}

.history-delete {
    float: right;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 2px;
}

/* MAIN */

.chat-container {
    width: 650px;
    max-width: 95%;
    height: 750px;
    margin: auto;
    background: white;
    border-radius: 15px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

body.dark .chat-container {
    background: #1e1e1e;
}

.header {
    background: #222;
    color: white;
    padding: 18px;
    text-align: center;
    position: relative;
}

.header h1 {
    margin: 0;
}

.header p {
    margin-bottom: 0;
}

.header-buttons {
    position: absolute;
    right: 10px;
    top: 10px;
    display: flex;
    gap: 5px;
}

.header-buttons button {
    padding: 8px 10px;
}

#messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.message {
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 10px;
    max-width: 85%;
    line-height: 1.5;
    overflow-wrap: break-word;
}

.user {
    background: #dbeafe;
    margin-left: auto;
}

body.dark .user {
    background: #263b52;
}

.ai {
    background: #eee;
    margin-right: auto;
}

body.dark .ai {
    background: #2b2b2b;
}

.art-preview {
    max-width: 250px;
    max-height: 250px;
    display: block;
    margin-top: 10px;
    border-radius: 8px;
}

.input-area {
    padding: 15px;
    border-top: 1px solid #ddd;
}

body.dark .input-area {
    border-color: #444;
}

.controls {
    display: flex;
    gap: 8px;
}

#messageInput {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

body.dark #messageInput {
    background: #292929;
    color: white;
    border-color: #555;
}

button {
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

#attachButton {
    background: #eee;
}

#sendButton {
    background: #222;
    color: white;
}

#fileInput {
    display: none;
}

#selectedFile {
    display: none;
    margin-bottom: 10px;
    padding: 8px;
    background: #f0f0f0;
    border-radius: 8px;
}

body.dark #selectedFile {
    background: #292929;
}

#selectedImage {
    max-width: 100px;
    max-height: 100px;
    display: none;
    margin-top: 5px;
}

.private {
    background: #7c2d12 !important;
    color: white;
}

.clear-history {
    margin-top: 10px;
    width: 100%;
    background: #ddd;
}

body.dark .clear-history {
    background: #444;
    color: white;
}

@media (max-width: 800px) {

    .sidebar {
        display: none;
    }

    .chat-container {
        height: 95vh;
    }

}

</style>

</head>

<body>

<div class="app">

<!-- HISTORY -->

<div class="sidebar">

<h2>📚 History</h2>

<input
    id="historySearch"
    placeholder="Search history..."
>

<div
    id="history"
    class="history">
</div>

<button
    class="clear-history"
    id="clearHistory">
    🗑️ Clear History
</button>

</div>


<!-- CHAT -->

<div class="chat-container">

<div class="header">

<div class="header-buttons">

<button
    id="themeButton">
    🌙
</button>

<button
    id="privateButton">
    🔓
</button>

</div>

<h1>Art Mentor 🎨</h1>

<p>
Critical, honest and encouraging
</p>

</div>


<div id="messages">

<div class="message ai">

<b>Art Mentor:</b>

<p>
Upload an artwork and I'll give you an honest critique.
</p>

<p>
I'll also rate every artwork out of 10.
</p>

</div>

</div>


<div class="input-area">

<div id="selectedFile">

<b>Selected artwork:</b>

<span id="fileName"></span>

<img id="selectedImage">

</div>


<div class="controls">

<input
    id="messageInput"
    placeholder="Ask your art teacher..."
    autocomplete="off"
>

<input
    id="fileInput"
    type="file"
    accept="image/png,image/jpeg,image/webp"
>

<button id="attachButton">
📎
</button>

<button id="sendButton">
Send
</button>

</div>

</div>

</div>

</div>


<script>

const input =
document.getElementById("messageInput");

const messages =
document.getElementById("messages");

const fileInput =
document.getElementById("fileInput");

const attachButton =
document.getElementById("attachButton");

const sendButton =
document.getElementById("sendButton");

const selectedFile =
document.getElementById("selectedFile");

const fileName =
document.getElementById("fileName");

const selectedImage =
document.getElementById("selectedImage");

const themeButton =
document.getElementById("themeButton");

const privateButton =
document.getElementById("privateButton");

const historyElement =
document.getElementById("history");

const historySearch =
document.getElementById("historySearch");

const clearHistory =
document.getElementById("clearHistory");


let selectedImageData = null;

let privateMode = false;

let currentConversation = null;


/* THEME */

if (
localStorage.getItem("artMentorTheme")
=== "dark"
) {

document.body.classList.add("dark");

themeButton.textContent = "☀️";

}


themeButton.onclick =
function () {

document.body.classList.toggle("dark");

const dark =
document.body.classList.contains("dark");

themeButton.textContent =
dark ? "☀️" : "🌙";

localStorage.setItem(
"artMentorTheme",
dark ? "dark" : "light"
);

};


/* PRIVATE MODE */

privateButton.onclick =
function () {

privateMode =
!privateMode;

if (privateMode) {

privateButton.textContent = "🔒";

privateButton.classList.add(
"private"
);

privateButton.title =
"Private mode ON";

} else {

privateButton.textContent = "🔓";

privateButton.classList.remove(
"private"
);

privateButton.title =
"Private mode OFF";

}

};


/* FILE */

attachButton.onclick =
function () {

fileInput.click();

};


fileInput.onchange =
function () {

const file =
fileInput.files[0];

if (!file) return;

if (!file.type.startsWith("image/")) {

alert("Please select an image.");

return;

}

fileName.textContent =
file.name;

selectedFile.style.display =
"block";

const reader =
new FileReader();

reader.onload =
function (event) {

selectedImage.src =
event.target.result;

selectedImage.style.display =
"block";

selectedImageData = {

mimeType: file.type,

data:
event.target.result
.split(",")[1]

};

};

reader.readAsDataURL(file);

};


/* HISTORY */

function getHistory() {

return JSON.parse(
localStorage.getItem(
"artMentorHistory"
) || "[]"
);

}


function saveHistory(history) {

localStorage.setItem(
"artMentorHistory",
JSON.stringify(history)
);

}


function renderHistory() {

const history =
getHistory();

const search =
historySearch.value
.toLowerCase();

historyElement.innerHTML = "";

history
.filter(item =>
item.title
.toLowerCase()
.includes(search)
)
.forEach(item => {

const div =
document.createElement("div");

div.className =
"history-item";

div.innerHTML = `

<span>${escapeHTML(item.title)}</span>

<button
class="history-delete"
data-id="${item.id}">
🗑️
</button>

`;

div.onclick =
function () {

loadConversation(item.id);

};

const deleteButton =
div.querySelector(
".history-delete"
);

deleteButton.onclick =
function (event) {

event.stopPropagation();

deleteConversation(item.id);

};

historyElement.appendChild(div);

});

}


function deleteConversation(id) {

const history =
getHistory().filter(
item => item.id !== id
);

saveHistory(history);

renderHistory();

}


clearHistory.onclick =
function () {

if (
confirm(
"Delete all conversation history?"
)
) {

localStorage.removeItem(
"artMentorHistory"
);

renderHistory();

}

};


historySearch.oninput =
renderHistory;


/* CREATE CONVERSATION */

function createConversation(message) {

const title =
message.length > 35
? message.substring(0, 35) + "..."
: message || "Artwork critique";

return {

id: Date.now(),

title: title,

messages: []

};

}


/* SAVE CONVERSATION */

function saveCurrentConversation() {

if (
privateMode ||
!currentConversation
) {

return;

}

const history =
getHistory();

const index =
history.findIndex(
item =>
item.id === currentConversation.id
);

if (index >= 0) {

history[index] =
currentConversation;

} else {

history.unshift(
currentConversation
);

}

saveHistory(history);

renderHistory();

}


/* LOAD CONVERSATION */

function loadConversation(id) {

const history =
getHistory();

const conversation =
history.find(
item => item.id === id
);

if (!conversation) return;

currentConversation =
conversation;

messages.innerHTML = "";

conversation.messages.forEach(
message => {

const div =
document.createElement("div");

div.className =
"message " +
message.role;

div.innerHTML =
message.html;

messages.appendChild(div);

});

messages.scrollTop =
messages.scrollHeight;

}


/* SEND */

sendButton.onclick =
sendMessage;


input.onkeydown =
function (event) {

if (event.key === "Enter") {

event.preventDefault();

sendMessage();

}

};


async function sendMessage() {

const message =
input.value.trim();

if (
message === "" &&
!selectedImageData
) {

return;

}


/* CONVERSATION */

if (
!currentConversation &&
!privateMode
) {

currentConversation =
createConversation(message);

}


/* USER MESSAGE */

let userHTML =
"<b>You:</b>";

if (message) {

userHTML +=
`<p>${escapeHTML(message)}</p>`;

}

if (selectedImageData) {

userHTML += `

<img
class="art-preview"
src="data:${selectedImageData.mimeType};base64,${selectedImageData.data}"
>

`;

}


const userDiv =
document.createElement("div");

userDiv.className =
"message user";

userDiv.innerHTML =
userHTML;

messages.appendChild(userDiv);


/* SAVE USER */

if (!privateMode) {

currentConversation.messages.push({

role: "user",

html: userHTML

});

saveCurrentConversation();

}


input.value = "";


/* LOADING */

const loading =
document.createElement("div");

loading.className =
"message ai";

loading.innerHTML =
"<b>Art Mentor:</b> Analyzing...";

messages.appendChild(loading);

messages.scrollTop =
messages.scrollHeight;


try {

const response =
await fetch(
"https://ai-rxzd.onrender.com/chat",
{

method: "POST",

headers: {

"Content-Type":
"application/json"

},

body: JSON.stringify({

message: message,

image: selectedImageData,

privateMode:
privateMode

})

});


if (!response.ok) {

throw new Error(
"Server returned HTTP " +
response.status
);

}


const data =
await response.json();

loading.remove();


const replyHTML = `

<b>Art Mentor:</b>

<p>
${formatResponse(data.reply)}
</p>

`;


const aiDiv =
document.createElement("div");

aiDiv.className =
"message ai";

aiDiv.innerHTML =
replyHTML;

messages.appendChild(aiDiv);


/* SAVE AI */

if (!privateMode) {

currentConversation.messages.push({

role: "ai",

html: replyHTML

});

saveCurrentConversation();

}


} catch (error) {

console.error(error);

loading.innerHTML = `

<b>Art Mentor:</b>

<p>
Connection failed.
</p>

<small>
${escapeHTML(error.message)}
</small>

`;

}


/* CLEAR IMAGE */

selectedImageData = null;

fileInput.value = "";

selectedFile.style.display =
"none";

selectedImage.style.display =
"none";

messages.scrollTop =
messages.scrollHeight;

}


/* HELPERS */

function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent =
text;

return div.innerHTML;

}


function formatResponse(text) {

if (!text) {

return "The AI returned an empty response.";

}

return escapeHTML(text)
.replace(/\n/g, "<br>");

}


renderHistory();

</script>

</body>

</html>
